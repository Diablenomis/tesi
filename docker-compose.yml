version: '2'

services:
    nginx: 
        restart: unless-stopped
        container_name: gym_fe
        image: gym-frontend:0.2.3
        ports:
          - "80:80"
          - "443:443"
        volumes:
            - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
            - ./nginx/certs:/etc/nginx/certs
        depends_on: 
            - backend
            
    backend:
        restart: unless-stopped
        container_name: gym_be
        image: gym-backend:0.2.17
        entrypoint: /app/docker/backend/entrypoint.sh
        volumes:
            - logs:/app/backend/logs
        expose:
            - 8000
        env_file:
            - ./environments/.env
            - ./environments/.prod.env
        depends_on:
          mysql:
            condition: service_healthy
          
    celery:
        container_name: worker
        image: gym-backend:0.2.17
        entrypoint: /app/docker/backend/entrypoint_celery.sh
        env_file:
            - ./environments/.env
            - ./environments/.prod.env
        depends_on: 
            - backend
            - redis
    
    celerybeat:
        container_name: scheduler
        image: gym-backend:0.2.17
        entrypoint: /app/docker/backend/entrypoint_celerybeat.sh
        env_file:
            - ./environments/.env
            - ./environments/.prod.env
        depends_on: 
            - celery

    mysql:
      image: mysql:latest
      container_name: gym_db
      restart: always
      env_file:
        - ./environments/.env
        - ./environments/.prod.env
      volumes:
        - mysql_data:/var/lib/mysql
      ports:
        - "3306:3306"
      healthcheck:
        test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
        interval: 3s
        timeout: 30s
        retries: 10
        
    redis:
        image: redis:alpine
        expose:
          - 6379
        depends_on:
          mysql:
            condition: service_healthy
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 30s
          timeout: 10s
          retries: 5
          start_period: 10s

volumes:
    logs:
    mysql_data: