version: '2'

services:
  nginx:
    restart: unless-stopped
    container_name: gym_fe
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile   # <--- CONTROLLA che questo path esista!
    image: gym-frontend:0.2.12
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/development:/etc/nginx/conf.d
      - ./docker/nginx/certs:/etc/nginx/certs
      - ./gym-fe-app:/app/frontend  # Monta il codice sorgente del frontend per sviluppo
    depends_on:
      - backend

  backend:
    restart: unless-stopped
    container_name: gym_be
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    image: gym-backend:0.2.23
    entrypoint: /app/docker/backend/entrypoint.sh
    volumes:
      - static_volume:/app/backend/static
      - ./logs:/app/backend/logs
      - ./gym-be-app/app:/app/backend  # Monta il codice sorgente del backend per sviluppo
    ports:
      - "8000:8000"
    env_file:
      - ./docker/environments/.env
      - ./docker/environments/.docker_dev.env
    depends_on:
      mysql:
        condition: service_healthy

  celery:
    container_name: worker
    image: gym-backend:0.2.23          # <--- riuso l'immagine del backend
    entrypoint: /app/docker/backend/entrypoint_celery.sh
    env_file:
      - ./docker/environments/.env
      - ./docker/environments/.docker_dev.env
    depends_on:
      - backend
      - redis

  celerybeat:
    container_name: scheduler
    image: gym-backend:0.2.23          # <--- riuso l'immagine del backend
    entrypoint: /app/docker/backend/entrypoint_celerybeat.sh
    env_file:
      - ./docker/environments/.env
      - ./docker/environments/.docker_dev.env
    depends_on:
      - celery
      - redis

  mysql:
    image: mysql:8
    container_name: gym_db
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - ./docker/environments/.env
      - ./docker/environments/.docker_dev.env
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 3s
      timeout: 30s
      retries: 10

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  static_volume: {}
