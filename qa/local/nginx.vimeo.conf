server {
  listen 80;
  root /usr/share/nginx/html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.vimeocdn.com; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 https://*.vimeo.com; frame-src https://player.vimeo.com; object-src 'none'; form-action 'self'; base-uri 'self'" always;
  location / { try_files $uri $uri/ /index.html; }
}
server {
  listen 8000;
  location / {
    proxy_set_header Host localhost;
    proxy_pass http://backend:8000;
  }
}
